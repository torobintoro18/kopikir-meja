<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopikir — Pesan dari Meja</title>
<style>
  :root{ --kopi:#6F4E37; --karamel:#C08A3E; --krim:#FFF8F0; --hijau:#2E7D32; --merah:#C62828; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--krim); color:#2b211a; }
  header{ background:linear-gradient(120deg,#6F4E37,#3E2723); color:#fff; padding:16px; position:sticky; top:0; z-index:5; }
  header .nama{ font-size:20px; font-weight:800; letter-spacing:.4px; }
  header .sub{ font-size:13px; opacity:.85; }
  main{ max-width:560px; margin:0 auto; padding:14px 14px 120px; }
  .kartu{ background:#fff; border-radius:14px; padding:13px; margin-bottom:11px; box-shadow:0 1px 5px rgba(62,39,35,.13); }
  .produk{ display:flex; gap:11px; align-items:center; }
  .emoji{ font-size:30px; width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .produk b{ font-size:15px; } .hint{ font-size:12.5px; color:#7a6a5f; } .rp{ color:var(--kopi); font-weight:800; }
  .qty{ display:flex; align-items:center; gap:8px; }
  .qty button{ width:32px; height:32px; border-radius:50%; border:1.5px solid var(--kopi); background:#fff; color:var(--kopi); font-size:17px; font-weight:800; cursor:pointer; }
  .qty button.plus{ background:var(--kopi); color:#fff; }
  label{ display:block; font-size:12.5px; font-weight:700; color:var(--kopi); margin:9px 0 4px; }
  input,textarea{ width:100%; padding:11px; border:1.5px solid #d8c9bb; border-radius:10px; font-size:15px; background:#fff; }
  .tombol{ width:100%; padding:13px; border:none; border-radius:12px; background:var(--kopi); color:#fff; font-size:16px; font-weight:800; cursor:pointer; }
  .tombol:disabled{ opacity:.55; } .tombol.hijau{ background:var(--hijau); } .tombol.sekunder{ background:#EFE6DC; color:var(--kopi); }
  .barbawah{ position:fixed; left:0; right:0; bottom:0; background:#fff; box-shadow:0 -2px 10px rgba(0,0,0,.13); padding:11px 14px; }
  .barbawah .inner{ max-width:560px; margin:0 auto; display:flex; align-items:center; gap:11px; }
  .toast{ position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(20px); background:#2b211a; color:#fff; padding:10px 16px; border-radius:99px; font-size:13.5px; opacity:0; transition:.25s; pointer-events:none; max-width:92vw; text-align:center; z-index:9; }
  .toast.muncul{ opacity:1; transform:translateX(-50%) translateY(0); }
  .tabakun{ display:flex; gap:8px; } .tabakun button{ flex:1; }
  .sukses{ text-align:center; padding:26px 10px; } .sukses .ikon{ font-size:52px; }
</style>
</head>

    k.innerHTML = '<div class="kartu" style="background:#E8F5E9;box-shadow:none;border:1px solid #A5D6A7">' +
      '👋 Halo, <b>' + esc(profil.nama) + '</b> · 🪑 Meja ' + meja.nomor + '<br>' +
      '<span class="hint">Pesan dari halaman ini — tagihan dibayar di kasir sebelum pulang. <a href="#" id="tautKeluar">Keluar</a></span></div>';
    $('#tautKeluar').addEventListener('click', function(e){ e.preventDefault(); sesi = null; profil = null; simpanSesi(); gambarAkun(); });
    return;
  }
  if(tamuNama){
    k.innerHTML = '<div class="kartu" style="background:#FFF8E1;box-shadow:none;border:1px solid #FFE082">' +
      '👋 Halo, <b>' + esc(tamuNama) + '</b> · 🪑 Meja ' + meja.nomor + ' <span class="hint">(pesan sebagai tamu)</span><br>' +
      '<span class="hint">Pesananmu langsung masuk dapur — bayar di kasir sebelum pulang. <a href="#" id="tautGantiTamu">Ganti nama</a></span></div>' +
      '<div class="kartu" style="background:#E8F5E9;box-shadow:none;border:1px solid #A5D6A7">💡 <b>Sering mampir?</b> Daftar akun Kopikir biar pesan berikutnya lebih cepat (plus poin &amp; promo), dan simpan halaman ini ke layar utama HP-mu lewat menu browser → <b>Tambah ke Layar Utama</b> supaya terasa seperti aplikasi. Minta APK Kopikir ke kasir bila mau aplikasi penuhnya.</div>';
    $('#tautGantiTamu').addEventListener('click', function(e){ e.preventDefault(); tamuNama = ''; gambarAkun(); });
    return;
  }
  k.innerHTML = '<div class="kartu" style="background:#FFF8E1;box-shadow:none;border:1px solid #FFE082"><b>👋 Pesan sebagai tamu — tanpa daftar!</b>' +
    '<div class="hint">Cukup isi nama, pesanan langsung masuk dapur. Bayar di kasir sebelum pulang.</div>' +
    '<label>Nama kamu</label><input id="tamuNama" placeholder="cth: Budi">' +
    '<div style="height:8px"></div><button class="tombol" id="btnTamu">Lanjut Pesan sebagai Tamu</button></div>' +
    '<div class="kartu" style="background:#E8F5E9;box-shadow:none;border:1px solid #A5D6A7">💡 <b>Sering mampir?</b> Daftar akun biar pesan berikutnya lebih cepat (plus poin &amp; promo) — atau simpan halaman ini ke layar utama HP lewat menu browser → <b>Tambah ke Layar Utama</b>.</div>' +
    '<div class="kartu"><b>🪑 Meja ' + meja.nomor + '</b> — atau masuk / daftar akun dulu supaya kasir tahu pesanan ini milik siapa.' +
    '<div class="tabakun" style="margin-top:10px">' +
    '<button class="tombol kecil ' + (modeAkun === 'daftar' ? '' : 'sekunder') + '" data-modeakun="daftar" style="padding:9px">Daftar</button>' +
    '<button class="tombol kecil ' + (modeAkun === 'masuk' ? '' : 'sekunder') + '" data-modeakun="masuk" style="padding:9px">Masuk</button></div>' +
    (modeAkun === 'daftar' ? '<label>Nama</label><input id="akNama" placeholder="cth: Budi">' : '') +
    '<label>Nomor HP (WhatsApp)</label><input id="akHp" inputmode="tel" placeholder="08xxxxxxxxxx">' +
    '<label>Password</label><input id="akSandi" type="password" placeholder="Minimal 6 karakter">' +
    '<div style="height:10px"></div><button class="tombol" id="btnAkun">' + (modeAkun === 'daftar' ? 'Daftar & Lanjut Pesan' : 'Masuk & Lanjut Pesan') + '</button></div>';
  $('#btnTamu').addEventListener('click', function(){
    var nm = $('#tamuNama').value.trim();
    if(nm.length < 2){ toast('Isi nama dulu ya'); return; }
    tamuNama = nm; gambarAkun();
    toast('👋 Halo, ' + nm + ' — silakan pilih menu!');
  });
  k.querySelectorAll('[data-modeakun]').forEach(function(b){
    b.addEventListener('click', function(){ modeAkun = b.dataset.modeakun; gambarAkun(); });
  });
  $('#btnAkun').addEventListener('click', function(){
    var hp = $('#akHp').value.replace(/\D/g, ''), sandi = $('#akSandi').value;
    if(hp.length < 9){ toast('Nomor HP belum benar'); return; }
    if(sandi.length < 6){ toast('Password minimal 6 karakter'); return; }
    var tombol = this; tombol.disabled = true;
    if(modeAkun === 'daftar'){
      var nama = $('#akNama').value.trim();
      if(nama.length < 2){ toast('Isi nama dulu ya'); tombol.disabled = false; return; }
      panggil('/auth/v1/signup', { method: 'POST', body: { email: emailDariHp(hp), password: sandi } }).then(function(j){
        if(j && j.session){ sesi = j.session; simpanSesi(); }
        var uid = (j && j.user && j.user.id) || (sesi && sesi.user && sesi.user.id);
        if(!uid || !sesi) throw new Error('Sesi belum aktif — coba Masuk');
        return panggil('/rest/v1/profil', { method: 'POST', kepala: { Prefer: 'resolution=merge-duplicates' }, body: { id: uid, nama: nama, no_hp: hp, peran: 'pelanggan' } });
      }).then(function(){ return muatProfil(); }).then(function(){ toast('✅ Akun siap — silakan pesan'); })
      .catch(function(e){ tombol.disabled = false; toast('❌ ' + (e.message || 'Gagal daftar')); });
    } else {
      panggil('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: emailDariHp(hp), password: sandi } })
      .then(function(j){ sesi = j; simpanSesi(); return muatProfil(); })
      .then(function(p){ if(!p) toast('Profil tidak ditemukan'); else toast('✅ Halo lagi, ' + p.nama + '!'); })
      .catch(function(){ tombol.disabled = false; toast('❌ Nomor HP / password salah'); });
    }
  });
}

function gambarMenu(){
  $('#daftarMenu').innerHTML = produk.filter(function(p){ return !p.nonaktif; }).map(function(p){
    var q = keranjang[p.id] || 0;
    return '<div class="kartu produk"><div class="emoji" style="background:' + esc(p.latar) + '">' + esc(p.emoji) + '</div>' +
      '<div style="flex:1"><b>' + esc(p.nama) + '</b><div class="hint">' + esc(p.desk || '') + '</div>' +
      '<div class="rp">' + fmtRp(p.harga) + '</div></div>' +
      (p.stok <= 0 ? '<span class="hint" style="font-weight:800;color:var(--merah)">HABIS</span>' :
      '<div class="qty"><button data-qty="' + p.id + ':-1" aria-label="kurang">−</button><b>' + q + '</b><button class="plus" data-qty="' + p.id + ':1" aria-label="tambah">+</button></div>') +
      '</div>';
  }).join('');
  document.querySelectorAll('[data-qty]').forEach(function(b){
    b.addEventListener('click', function(){
      var pr = b.dataset.qty.split(':');
      keranjang[pr[0]] = Math.max(0, (keranjang[pr[0]] || 0) + (+pr[1]));
      if(!keranjang[pr[0]]) delete keranjang[pr[0]];
      gambarMenu(); segarBar();
    });
  });
}
function totalKeranjang(){
  return Object.keys(keranjang).reduce(function(s, id){
    var p = produk.filter(function(x){ return x.id === id; })[0];
    return s + (p ? p.harga * keranjang[id] : 0);
  }, 0);
}
function segarBar(){
  var n = Object.keys(keranjang).reduce(function(s, id){ return s + keranjang[id]; }, 0);
  $('#barBawah').style.display = n ? 'block' : 'none';
  $('#ringkasBar').textContent = n + ' item · Meja ' + meja.nomor + ' · bayar di kasir';
  $('#totalBar').textContent = fmtRp(totalKeranjang());
}

function kirimPesanan(){
  if(!profil && !tamuNama){ toast('Isi nama tamu di atas dulu ya (atau masuk/daftar)'); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  var item = Object.keys(keranjang).map(function(id){
    return { produkId: id, ukuran: 'Reguler', gula: 'Normal', es: null, ekstra: [], qty: keranjang[id], catatan: '' };
  });
  if(!item.length){ toast('Pilih menu dulu ya'); return; }
  var tombol = $('#btnKirim'); tombol.disabled = true;
  var id = 'WEB-' + Date.now().toString(36).toUpperCase();
  var total = totalKeranjang();
  panggil('/rest/v1/pesanan', { method: 'POST', kepala: { Prefer: 'return=minimal' }, body: {
    id: id, kode_ambil: 'MEJA-' + meja.nomor, kanal: 'MEJA', meja: meja.nomor,
    pelanggan_id: profil ? profil.id : null, nama_pemesan: profil ? profil.nama : tamuNama, item: item,
    subtotal: total, diskon: 0, total: total, kupon: '', slot: 'Dine-in · Meja ' + meja.nomor,
    status: 'DIBUAT', dibayar: false, split: null, rating: 0, ulasan: '', pengiriman: null
  }}).then(function(){
    $('#utama').style.display = 'none'; $('#barBawah').style.display = 'none';
    var s = $('#selesai'); s.style.display = 'block';
    s.innerHTML = '<div class="kartu sukses"><div class="ikon">✅</div><h2>Pesanan Terkirim ke Dapur!</h2>' +
      '<p class="hint">Nomor pesanan <b>' + id + '</b> · Meja ' + meja.nomor + ' · 🕐 ' + (function(){ var t = new Date(); function p2(n){ return ('0' + n).slice(-2); } return p2(t.getDate()) + '/' + p2(t.getMonth() + 1) + '/' + t.getFullYear() + ' ' + p2(t.getHours()) + ':' + p2(t.getMinutes()); })() + '<br>Total tagihan <b>' + fmtRp(total) + '</b> — dibayar di kasir sebelum pulang. Tunjukkan nomor pesanan ini bila ditanya kasir.</p>' +
      '<div class="kartu" style="background:#E8F5E9;box-shadow:none;border:1px solid #A5D6A7;text-align:left">💡 <b>Sering mampir?</b> Daftar akun Kopikir biar pesan berikutnya lebih cepat (plus poin &amp; promo) — ketuk Pesan Lagi lalu daftar di bagian atas, atau simpan halaman ini ke layar utama HP-mu.</div>' +
      '<button class="tombol sekunder" onclick="location.reload()">Pesan Lagi</button></div>';
  }).catch(function(e){
    tombol.disabled = false;
    toast('❌ Gagal mengirim: ' + (e.message || 'coba lagi'));
  });
}
$('#btnKirim').addEventListener('click', kirimPesanan);

/* ---------------- mulai ---------------- */
(function mulai(){
  if(!token){ $('#muat').innerHTML = '<b>QR tidak dikenal.</b><br><span class="hint">Halaman ini dibuka dari QR di meja gerai Kopikir. Pindai QR di mejamu, atau tanya kasir ya.</span>'; return; }
  panggil('/rest/v1/meja?select=*&token=eq.' + encodeURIComponent(token)).then(function(rows){
    if(!rows || !rows.length) throw new Error('Meja tidak ditemukan — QR mungkin sudah diganti. Tanya kasir ya.');
    meja = rows[0];
    return panggil('/rest/v1/gerai?select=*&id=eq.1');
  }).then(function(g){
    if(g && g[0]){
      $('#subKepala').textContent = g[0].nama + ' · ' + g[0].alamat;
      if(g[0].tutup){
        throw new Error('TUTUP::' + (g[0].pesan_tutup || 'Gerai sedang tutup — pemesanan dibuka lagi sesuai jam gerai.'));
      }
    }
    return panggil('/rest/v1/produk?select=*');
  }).then(function(rows){
    produk = rows || [];
    $('#muat').style.display = 'none'; $('#utama').style.display = 'block';
    $('#subKepala').textContent += ' · 🪑 Meja ' + meja.nomor;
    gambarMenu();
    if(sesi) muatProfil(); else gambarAkun();
  }).catch(function(e){
    var pesan = e.message || 'Periksa jaringan HP-mu lalu muat ulang halaman ini.';
    if(pesan.indexOf('TUTUP::') === 0){
      $('#muat').innerHTML = '<div style="text-align:center"><div style="font-size:38px">🚪</div><b>Gerai Sedang Tutup.</b><br><span class="hint">' + esc(pesan.slice(7)) + '</span></div>';
    } else {
      $('#muat').innerHTML = '<b>Belum bisa memuat.</b><br><span class="hint">' + esc(pesan) + '</span>';
    }
  });
})();
</script>
</body>
</html>
